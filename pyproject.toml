[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fem-travi"
version = "2.0.0"
description = "Solver FEM per travi e telai piani 2D (Euler-Bernoulli) con interfaccia grafica"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]
authors = [{ name = "Mariglend Allushi" }]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "matplotlib>=3.7"]

[project.scripts]
fem-travi = "fem_travi.app.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fem_travi*"]

[tool.setuptools.package-data]
"fem_travi.app" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
